<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Sección Trabajo — Videos / Lista</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght=400;500;600&display=swap');
:root {
--black: #0a0a0b;
--black-soft: #151517;
--black-card: #1b1b1d;
--yellow: #f5c518;
--yellow-dim: #c9a312;
--cream: #f3efe4;
--gray: #8c8c8f;
--gray-line: #2a2a2c;
--font-display: "Bebas Neue", sans-serif;
--font-body: "Space Grotesk", sans-serif;
--gap-lg: clamp(2.5rem, 6vw, 6rem);
}
* { box-sizing: border-box; }
body { margin:0; background: var(--black); font-family: var(--font-body); }
h1,h2,h3 { font-family: var(--font-display); letter-spacing:.02em; margin:0; color: var(--cream); }
ul { list-style: none; margin:0; padding:0; }
a, button { color: inherit; }

/* ===========================
SECTION - TRABAJO
=========================== */
.trabajo {
position: relative;
min-height: 100vh;
background: var(--black);
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
gap: 40px;
padding: 44px 20px 34px;
overflow: hidden;
}
/* --- Toggle superior --- */
.trabajo-toggle {
display: flex;
gap: 6px;
padding: 6px;
border: 1px solid var(--gray-line);
border-radius: 999px;
background: var(--black-soft);
z-index: 5;
}
.toggle-btn {
font-family: var(--font-body);
font-size: .8rem;
letter-spacing: .12em;
text-transform: uppercase;
padding: 10px 24px;
border-radius: 999px;
border: none;
background: transparent;
color: var(--gray);
cursor: pointer;
transition: background .25s ease, color .25s ease;
}
.toggle-btn.active {
background: var(--yellow);
color: var(--black);
font-weight: 600;
}
.toggle-btn:hover:not(.active) { color: var(--cream); }
.toggle-btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
/* --- Contenedor de vistas --- */
.view {
width: 100%;
max-width: 1690px;
flex: 1;
display: flex;
align-items: center;
justify-content: center;
position: relative;
min-height: 0;
}
.view-lista { display: none; gap: var(--gap-lg); }
.trabajo[data-view="lista"] .view-videos { display: none; }
.trabajo[data-view="lista"] .view-lista { display: flex; }
/* --- Vista VIDEOS: carrusel controlado por clic --- */
.h-carousel {
width: 100%;
overflow: hidden;
-webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
padding: 30px 0;
}
.h-track {
display: flex;
align-items: center;
gap: 14px;
width: max-content;
will-change: transform;
transform: translateX(0);
}

/* --- CONTENEDOR DE TARJETA EXTERNA --- */
.h-card-wrapper {
display: flex;
flex-direction: column;
gap: 8px;
flex-shrink: 0;
transition: transform .7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .4s ease;
transform: scale(.92);
opacity: .55;
}

/* --- Metadatos Superiores Externos --- */
.h-card-meta {
display: flex;
justify-content: space-between;
align-items: center;
padding: 0 4px;
font-family: var(--font-body);
color: var(--cream);
font-size: 0.72rem;
letter-spacing: 0.05em;
text-transform: uppercase;
opacity: 0;
transform: translateY(5px);
transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1), transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}
.h-card-views {
display: flex;
align-items: center;
gap: 4px;
}
.h-card-views svg {
width: 12px;
height: 12px;
fill: currentColor;
}

/* --- Revelar textos al pasar el ratón (hover) --- */
.h-card-wrapper:hover .h-card-meta {
opacity: 1;
transform: translateY(0);
}

/* --- La tarjeta activa mantiene siempre visibles los textos --- */
.h-card-wrapper.is-selected .h-card-meta {
opacity: 1;
transform: translateY(0);
}

/* --- El Recuadro del Video / Tarjeta --- */
.h-item {
position: relative;
width: min(30vw, 300px);
aspect-ratio: 16 / 10;
border-radius: 14px;
overflow: hidden;
border: 1px solid var(--gray-line);
cursor: pointer;
filter: grayscale(35%);
transition: filter .4s ease, border-color .4s ease, box-shadow .4s ease;
}
.h-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
.h-thumb {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
display: block;
opacity: 1;
transition: opacity .35s ease;
pointer-events: none;
}
.h-item.is-playing .h-thumb { opacity: 0; }

/* --- Tarjeta Seleccionada / Activa --- */
.h-card-wrapper.is-selected {
opacity: 1;
transform: scale(1.22);
z-index: 4;
}
.h-card-wrapper.is-selected .h-item {
filter: grayscale(0);
border-color: var(--yellow);
box-shadow: 0 25px 50px rgba(0,0,0,.55);
}

/* ========================================================
   SEPARACIÓN INTELIGENTE CON GPU (CERO SALTOS)
   ======================================================== */
.h-card-wrapper:has(~ .h-card-wrapper.is-selected) {
transform: scale(.92) translateX(-22px);
}
.h-card-wrapper.is-selected ~ .h-card-wrapper {
transform: scale(.92) translateX(22px);
}

/* ========================================================
   EFECTO GOTA DE AGUA (RIPPLE LÍQUIDO)
   ======================================================== */
.ripple-drop {
position: absolute;
border-radius: 50%;
background: rgba(245, 197, 24, 0.35);
transform: translate(-50%, -50%) scale(0);
animation: ripple-water 0.75s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
pointer-events: none;
z-index: 10;
}
@keyframes ripple-water {
0% {
width: 0;
height: 0;
opacity: 0.9;
box-shadow: 0 0 0 0px rgba(245, 197, 24, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
}
100% {
width: 320px;
height: 320px;
opacity: 0;
box-shadow: 0 0 0 30px rgba(245, 197, 24, 0), inset 0 0 30px rgba(255, 255, 255, 0);
transform: translate(-50%, -50%) scale(1.4);
}
}

/* Botón expandir sobre las tarjetas */
.h-expand {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%) scale(.7);
display: flex;
align-items: center;
gap: 8px;
padding: 10px 18px;
border-radius: 999px;
border: 1px solid rgba(243,239,228,.4);
background: rgba(10,10,11,.55);
backdrop-filter: blur(4px);
color: var(--cream);
font-family: var(--font-body);
font-size: .78rem;
letter-spacing: .1em;
text-transform: uppercase;
cursor: pointer;
opacity: 0;
pointer-events: none;
transition: opacity .3s ease, transform .3s ease, background .25s ease, border-color .25s ease;
z-index: 5;
}
.h-card-wrapper.is-selected .h-expand {
opacity: 1;
pointer-events: auto;
transform: translate(-50%, -50%) scale(1);
}
.h-expand:hover {
background: var(--yellow);
border-color: var(--yellow);
color: var(--black);
}

/* --- Vista LISTA --- */
.side-list {
display: flex;
flex-direction: column;
justify-content: center;
gap: 2px;
width: 230px;
}
.side-left { align-items: flex-end; text-align: right; }
.side-right { align-items: flex-start; text-align: left; }
.side-list li {
font-family: var(--font-display);
font-size: 1.4rem;
color: var(--gray);
opacity: .4;
padding: 10px 6px;
cursor: pointer;
transition: color .3s ease, opacity .3s ease, transform .3s ease;
}
.side-left li { transform-origin: right center; }
.side-right li { transform-origin: left center; }
.side-list li.active {
color: var(--yellow);
opacity: 1;
transform: scale(1.08);
}
.v-carousel {
position: relative;
width: 240px;
height: 480px;
overflow: hidden;
-webkit-mask-image: linear-gradient(180deg, transparent, #000 10%, #000 90%, transparent);
mask-image: linear-gradient(180deg, transparent, #000 10%, #000 90%, transparent);
}
.v-track {
display: flex;
flex-direction: column;
gap: 18px;
animation: v-scroll 55s linear infinite;
}
.trabajo.is-v-hover .v-track { animation-play-state: paused; }
.v-item {
position: relative;
width: 240px;
height: 135px;
border-radius: 10px;
overflow: hidden;
border: 2px solid transparent;
cursor: pointer;
flex-shrink: 0;
transition: border-color .3s ease, transform .3s ease;
}
.v-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
.v-item.active {
border-color: var(--yellow);
transform: scale(1.06);
}
@keyframes v-scroll { from { transform: translateY(0); } to { transform: translateY(-50%); } }

/* --- Editor, pie de sección --- */
.trabajo-editor {
font-family: var(--font-body);
font-size: .78rem;
letter-spacing: .18em;
text-transform: uppercase;
color: var(--gray);
z-index: 5;
display: flex;
align-items: baseline;
gap: 10px;
}
.trabajo-editor span {
font-family: var(--font-display);
font-size: 1.9rem;
letter-spacing: .04em;
text-transform: none;
color: var(--cream);
}

/* ========================================================
   MODAL DE VIDEO A PANTALLA COMPLETA
   ======================================================== */
.video-modal {
position: fixed;
inset: 0;
background: var(--black);
display: flex;
align-items: center;
justify-content: center;
z-index: 2000;
opacity: 0;
pointer-events: none;
transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1);
}
.video-modal.open {
opacity: 1;
pointer-events: auto;
transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.video-modal video {
width: 100vw;
height: 100vh;
object-fit: cover;
transform: scale(0.85);
transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
cursor: pointer;
}
.video-modal.open video {
transform: scale(1);
transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Cabecera simétrica en el modal */
.modal-header {
position: absolute;
top: 0;
left: 0;
width: 100%;
display: grid;
grid-template-columns: 1fr auto 1fr;
align-items: center;
padding: 24px 32px;
z-index: 10;
background: linear-gradient(180deg, rgba(10,10,11,0.85) 0%, rgba(10,10,11,0) 100%);
pointer-events: auto;
opacity: 0;
transform: translateY(-10px);
transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}
.video-modal.open .modal-header {
opacity: 1;
transform: translateY(0);
transition-delay: 0.3s;
}

/* Botón / Banner de información */
.modal-info-wrapper {
justify-self: start;
position: relative;
display: flex;
align-items: center;
height: 44px;
max-width: 44px;
background: rgba(10,10,11,0.55);
backdrop-filter: blur(8px);
border: 1px solid rgba(243, 239, 228, 0.2);
border-radius: 999px;
overflow: hidden;
cursor: pointer;
transition: max-width 0.5s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.25s ease;
}
.modal-info-wrapper:hover {
max-width: 320px;
border-color: var(--yellow);
}
.modal-info-btn {
display: flex;
align-items: center;
justify-content: center;
width: 42px;
height: 42px;
flex-shrink: 0;
border-radius: 50%;
border: none;
background: transparent;
color: var(--cream);
cursor: pointer;
transition: color 0.25s ease;
}
.modal-info-btn svg {
width: 22px;
height: 22px;
fill: currentColor;
}
.modal-info-wrapper:hover .modal-info-btn {
color: var(--yellow);
}
.modal-info-banner {
white-space: nowrap;
font-family: var(--font-body);
font-size: 0.78rem;
letter-spacing: 0.05em;
color: var(--cream);
text-decoration: none;
padding-right: 20px;
opacity: 0;
transform: translateX(-10px);
transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.modal-info-wrapper:hover .modal-info-banner {
opacity: 1;
transform: translateX(0);
transition-delay: 0.1s;
}

/* Título Centralizado */
.modal-title {
grid-column: 2;
text-align: center;
font-family: var(--font-display);
font-size: 2.2rem;
color: var(--cream);
letter-spacing: .04em;
text-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

/* Botón Cerrar */
.modal-close {
grid-column: 3;
justify-self: end;
background: rgba(10,10,11,0.55);
backdrop-filter: blur(8px);
border: 1px solid rgba(243, 239, 228, 0.2);
color: var(--cream);
font-size: 1.3rem;
width: 44px;
height: 44px;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all .25s ease;
}
.modal-close:hover {
border-color: var(--yellow);
color: var(--yellow);
background: rgba(245, 197, 24, 0.1);
}

/* ========================================================
   BOTÓN PLAY/PAUSA CENTRAL (ESTILO PREMIUM STREAMING)
   ======================================================== */
.modal-play-pause {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%) scale(0.9);
width: 80px;
height: 80px;
border-radius: 50%;
background: rgba(10, 10, 11, 0.65);
backdrop-filter: blur(8px);
border: 2px solid rgba(243, 239, 228, 0.25);
color: var(--yellow);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
z-index: 15;
opacity: 0;
pointer-events: none;
transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
            transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
            background 0.25s ease, 
            border-color 0.25s ease;
}
.modal-play-pause svg {
width: 32px;
height: 32px;
fill: currentColor;
}
.modal-play-pause:hover {
background: rgba(245, 197, 24, 0.15);
border-color: var(--yellow);
transform: translate(-50%, -50%) scale(1.05);
}

/* Control de iconos Play/Pausa */
.modal-play-pause .icon-pause { display: none; }
.modal-play-pause.is-playing .icon-play { display: none; }
.modal-play-pause.is-playing .icon-pause { display: block; }

/* Mostrar botón fijo cuando esté pausado */
.modal-play-pause.visible {
opacity: 1;
pointer-events: auto;
transform: translate(-50%, -50%) scale(1);
}

/* Animación rápida (Flash) al dar Play antes de desaparecer */
.modal-play-pause.flash {
animation: play-flash 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes play-flash {
0% {
opacity: 1;
transform: translate(-50%, -50%) scale(1);
}
100% {
opacity: 0;
transform: translate(-50%, -50%) scale(1.3);
}
}

/* Marca de Agua */
.modal-watermark {
position: absolute;
bottom: 34px;
left: 50%;
transform: translateX(-50%);
font-family: var(--font-body);
font-size: .78rem;
letter-spacing: .18em;
text-transform: uppercase;
color: var(--gray);
pointer-events: none;
z-index: 10;
display: flex;
align-items: baseline;
gap: 10px;
opacity: 0;
transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s; 
}
.modal-watermark span {
font-family: var(--font-display);
font-size: 1.9rem;
letter-spacing: .04em;
text-transform: none;
color: var(--cream);
}
.video-modal.open .modal-watermark {
opacity: 1;
}

@media (max-width: 860px) {
.view-lista { gap: 20px; }
.side-list { width: 110px; }
.side-list li { font-size: 1rem; padding: 7px 2px; }
.v-carousel, .v-item { width: 160px; }
.v-item { height: 92px; }
.modal-title { font-size: 1.5rem; }
.modal-header { padding: 16px 20px; }
.modal-play-pause { width: 64px; height: 64px; }
.modal-play-pause svg { width: 24px; height: 24px; }
}
@media (max-width: 560px) {
.side-list { display: none; }
}
</style>
</head>
<body>
<section id="trabajo" class="trabajo" data-view="videos">
<div class="trabajo-toggle" role="tablist" aria-label="Cambiar vista de trabajo">
<button class="toggle-btn active" data-view-btn="videos" role="tab" aria-selected="true">Videos</button>
<button class="toggle-btn" data-view-btn="lista" role="tab" aria-selected="false">Lista</button>
</div>
<div class="view view-videos">
<div class="h-carousel">
<div class="h-track" id="hTrack"></div>
</div>
</div>
<div class="view view-lista">
<ul class="side-list side-left" id="sideLeft"></ul>
<div class="v-carousel">
<div class="v-track" id="vTrack"></div>
</div>
<ul class="side-list side-right" id="sideRight"></ul>
</div>
<p class="trabajo-editor">Editado por <span>Camilo Botero Arango</span></p>
</section>

<div class="video-modal" id="videoModal" aria-hidden="true">
  <div class="modal-header">
    <div class="modal-info-wrapper">
      <button class="modal-info-btn" aria-label="Ver enlace del proyecto">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
      </button>
      <a href="#" class="modal-info-banner" id="modalInfoLink" target="_blank" rel="noopener">Ir al proyecto original</a>
    </div>

    <span class="modal-title" id="modalTitle"></span>
    <button class="modal-close" id="modalClose" aria-label="Cerrar vídeo">✕</button>
  </div>
  
  <video id="modalVideo" playsinline></video>
  
  <button class="modal-play-pause" id="modalPlayPause" aria-label="Reproducir o pausar">
    <svg class="icon-play" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <svg class="icon-pause" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
  </button>
  
  <div class="modal-watermark">Editado por <span>Camilo Botero Arango</span></div>
</div>

<script>
(function () {
const PROYECTOS = [
{ id: 'v1', titulo: 'Nocturno', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo1' },
{ id: 'v2', titulo: 'Aura', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo2' },
{ id: 'v3', titulo: 'Ríos', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo3' },
{ id: 'v4', titulo: 'Umbral', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo4' },
{ id: 'v5', titulo: 'Eco', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo5' },
{ id: 'v6', titulo: 'Deriva', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo6' },
{ id: 'v7', titulo: 'Latido', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo7' },
{ id: 'v8', titulo: 'Marea', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo8' },
{ id: 'v9', titulo: 'Fuego', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo9' },
{ id: 'v10', titulo: 'Vigilia', subtitulo: 'prueba', visitas: '1.2k', link: 'https://vimeo.com/ejemplo10' },
].map(p => ({ ...p, src: './videos/prueba.mp4', poster: './img/NoFotoTarjeta.png' }));

const section = document.getElementById('trabajo');
const hTrack = document.getElementById('hTrack');
const vTrack = document.getElementById('vTrack');
const sideLeft = document.getElementById('sideLeft');
const sideRight = document.getElementById('sideRight');
const modal = document.getElementById('videoModal');
const modalVideo= document.getElementById('modalVideo');
const modalTitle= document.getElementById('modalTitle');
const modalClose= document.getElementById('modalClose');
const modalPlayPause = document.getElementById('modalPlayPause');

// --- Construcción de vistas ---
function hItemHTML(p) {
return `
<div class="h-card-wrapper" data-video="${p.id}">
  <div class="h-card-meta">
    <span class="h-card-name">${p.subtitulo}</span>
    <span class="h-card-views">
      <svg viewBox="0 0 24 24">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
      ${p.visitas}
    </span>
  </div>
  <div class="h-item">
    <video muted playsinline preload="none" src="${p.src}"></video>
    <img class="h-thumb" src="${p.poster}" alt="${p.titulo}" loading="lazy">
    <button class="h-expand" type="button">Expandir</button>
  </div>
</div>`;
}
function vItemHTML(p) {
return `<div class="v-item" data-video="${p.id}">
<video muted loop playsinline preload="none" src="${p.src}"></video>
</div>`;
}

vTrack.innerHTML = PROYECTOS.map(vItemHTML).join('') + PROYECTOS.map(vItemHTML).join('');
const mitad = Math.ceil(PROYONTENT = PROYECTOS.length / 2);
const izquierda = PROYECTOS.slice(0, mitad);
const derecha = PROYECTOS.slice(mitad);
sideLeft.innerHTML = izquierda.map(p => `<li data-video="${p.id}">${p.titulo}</li>`).join('');
sideRight.innerHTML = derecha.map(p => `<li data-video="${p.id}">${p.titulo}</li>`).join('');

// --- Toggles ---
document.querySelectorAll('.toggle-btn').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('.toggle-btn').forEach(b => {
b.classList.remove('active');
b.setAttribute('aria-selected', 'false');
});
btn.classList.add('active');
btn.setAttribute('aria-selected', 'true');
section.dataset.view = btn.dataset.viewBtn;
});
});

// --- Carrusel horizontal ---
const hCarousel = document.querySelector('.h-carousel');
let isTransitioning = false;

hTrack.innerHTML = PROYECTOS.map(hItemHTML).join('');
let hItems = Array.from(hTrack.querySelectorAll('.h-card-wrapper'));

const CENTER_DOM_INDEX = 4;

function initializeCircularOrder(targetId) {
const currentIndex = hItems.findIndex(item => item.dataset.video === targetId);
const diff = currentIndex - CENTER_DOM_INDEX;

if (diff > 0) {
for (let i = 0; i < diff; i++) {
hTrack.appendChild(hTrack.firstElementChild);
}
} else if (diff < 0) {
for (let i = 0; i < Math.abs(diff); i++) {
hTrack.insertBefore(hTrack.lastElementChild, hTrack.firstElementChild);
}
}
hItems = Array.from(hTrack.querySelectorAll('.h-card-wrapper'));
}

initializeCircularOrder('v3');

function updateSelectedItemClasses() {
hItems.forEach((item, i) => {
const isSel = i === CENTER_DOM_INDEX;
item.classList.toggle('is-selected', isSel);
});
}

function centerSelected(animate = true) {
updateSelectedItemClasses();
const centerItem = hItems[CENTER_DOM_INDEX];
const containerWidth = hCarousel.clientWidth;
const itemOffsetLeft = centerItem.offsetLeft;
const itemWidth = centerItem.offsetWidth;
const targetX = containerWidth / 2 - (itemOffsetLeft + itemWidth / 2);

hTrack.style.transition = animate ? "transform .7s cubic-bezier(0.34, 1.56, 0.64, 1)" : "none";
hTrack.style.transform = `translateX(${targetX}px)`;
}

function rotateCarousel(steps) {
if (steps === 0 || isTransitioning) return;
isTransitioning = true;

const animateShift = () => {
const targetDomIndex = CENTER_DOM_INDEX + steps;
const targetItem = hItems[targetDomIndex];
const containerWidth = hCarousel.clientWidth;
const targetX = containerWidth / 2 - (targetItem.offsetLeft + targetItem.offsetWidth / 2);

hTrack.style.transition = "transform .7s cubic-bezier(0.34, 1.56, 0.64, 1)";
hTrack.style.transform = `translateX(${targetX}px)`;

hItems.forEach((item, i) => {
item.classList.toggle('is-selected', i === targetDomIndex);
});

setTimeout(() => {
if (steps > 0) {
for (let i = 0; i < steps; i++) hTrack.appendChild(hTrack.firstElementChild);
} else {
for (let i = 0; i < Math.abs(steps); i++) hTrack.insertBefore(hTrack.lastElementChild, hTrack.firstElementChild);
}
hItems = Array.from(hTrack.querySelectorAll('.h-card-wrapper'));
centerSelected(false);
isTransitioning = false;
}, 600);
};
requestAnimationFrame(animateShift);
}

function attachHItemEvents() {
hItems.forEach((wrapper) => {
const item = wrapper.querySelector('.h-item');
const video = wrapper.querySelector('video');
const expandBtn = wrapper.querySelector('.h-expand');

wrapper.addEventListener('mouseenter', () => {
item.classList.add('is-playing');
video.currentTime = 0;
video.play().catch(() => {});
});

wrapper.addEventListener('mouseleave', () => {
item.classList.remove('is-playing');
video.pause();
});

wrapper.addEventListener('click', (e) => {
if (isTransitioning) return;
const rect = item.getBoundingClientRect();
const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

const ripple = document.createElement('span');
ripple.className = 'ripple-drop';
ripple.style.left = `${x}px`;
ripple.style.top = `${y}px`;
item.appendChild(ripple);
setTimeout(() => ripple.remove(), 750);

const clickedIndex = hItems.indexOf(wrapper);
rotateCarousel(clickedIndex - CENTER_DOM_INDEX);
});

expandBtn.addEventListener('click', (e) => {
e.stopPropagation();
openModal(wrapper.dataset.video);
});
});
}

attachHItemEvents();
centerSelected(false);

let resizeTimer;
window.addEventListener('resize', () => {
clearTimeout(resizeTimer);
resizeTimer = setTimeout(() => centerSelected(false), 150);
});

// --- Vista Lista ---
function setActiveName(id) {
document.querySelectorAll('.side-list li').forEach(li => li.classList.toggle('active', li.dataset.video === id));
document.querySelectorAll('.v-item').forEach(v => v.classList.toggle('active', v.dataset.video === id));
}
function clearActiveName() {
document.querySelectorAll('.side-list li, .v-item').forEach(el => el.classList.remove('active'));
}

vTrack.querySelectorAll('.v-item').forEach(item => {
item.addEventListener('mouseenter', () => {
section.classList.add('is-v-hover');
setActiveName(item.dataset.video);
});
item.addEventListener('click', () => openModal(item.dataset.video));
});
vTrack.addEventListener('mouseleave', () => {
section.classList.remove('is-v-hover');
clearActiveName();
});
document.querySelectorAll('.side-list li').forEach(li => {
li.addEventListener('mouseenter', () => setActiveName(li.dataset.video));
li.addEventListener('mouseleave', clearActiveName);
li.addEventListener('click', () => openModal(li.dataset.video));
});

// --- Manejo del Modal ---
function openModal(id) {
const proyecto = PROYECTOS.find(p => p.id === id);
if (!proyecto) return;
modalVideo.src = proyecto.src;
modalTitle.textContent = proyecto.titulo;

document.getElementById('modalInfoLink').href = proyecto.link || '#';

modal.classList.add('open');
modal.setAttribute('aria-hidden', 'false');

// Al abrir, intentamos reproducir
modalVideo.play()
  .then(() => {
    modalPlayPause.classList.remove('visible');
    modalPlayPause.classList.add('is-playing');
  })
  .catch(() => {
    // Si el navegador bloquea la autorreproducción, mostramos el botón Play fijo
    modalPlayPause.classList.add('visible');
    modalPlayPause.classList.remove('is-playing');
  });
}

function closeModal() {
modal.classList.remove('open');
modal.setAttribute('aria-hidden', 'true');
modalVideo.pause();
modalVideo.removeAttribute('src');
modalVideo.load();
modalPlayPause.classList.remove('visible', 'is-playing', 'flash');
}

// Función unificada para pausar o reproducir con animación visual
function togglePlay() {
// Limpiamos clases de animación temporal antes de calcular
modalPlayPause.classList.remove('flash');

if (modalVideo.paused) {
modalVideo.play()
  .then(() => {
    modalPlayPause.classList.remove('visible');
    modalPlayPause.classList.add('is-playing');
    // Forzamos un pequeño "flash" de animación al pulsar Play y desaparecer
    void modalPlayPause.offsetWidth; // Hack para reiniciar animación CSS
    modalPlayPause.classList.add('flash');
    setTimeout(() => {
      modalPlayPause.classList.remove('flash');
    }, 750);
  })
  .catch(() => {});
} else {
modalVideo.pause();
modalPlayPause.classList.remove('is-playing');
modalPlayPause.classList.add('visible');
}
}

// Al hacer clic en el video o en el propio botón central se alterna el estado
modalVideo.addEventListener('click', togglePlay);
modalPlayPause.addEventListener('click', (e) => {
e.stopPropagation(); // Evitar doble evento de clic
togglePlay();
});

// Cierre automático al finalizar la reproducción
modalVideo.addEventListener('ended', closeModal);

modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => {
if (e.target === modal) closeModal();
});
document.addEventListener('keydown', e => {
if (e.key === 'Escape') closeModal();
});
})();
</script>
</body>
