<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Filmmaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    ============================================================
    NOTA (integración de video real)
    ============================================================
    Los videos se listan en el array VIDEO_SOURCES, al final del
    archivo (dentro del <script>). A medida que tengas más clips, 
    solo agrega más rutas a ese array.
    ============================================================
  */

  :root{
    /* --- NEGRO (secundario) y variantes --- */
    --black: #0a0a0b;
    --black-soft: #151517;
    --black-card: #1b1b1d;
    --gray-line: #2a2a2c;
    --cream: #f3efe4;

    /* --- AMARILLO y variantes (para los respaldos de las tarjetas) --- */
    --yellow-dim: #c9b000;
    --yellow-dark: #8f7c00;

    /* --- MORADO y variantes (para los respaldos de las tarjetas) --- */
    --purple-dim: #7a1f9e;
    --purple-dark: #591675;

    --row-h: 25vh;
    --gap: 14px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    background: var(--black);
    color: var(--cream);
    overflow: hidden;
    height: 100%;
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ===================== ESCENARIO DE CARRUSELES ===================== */

  #carousel-stage{
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--black);
    z-index: 1;
    transition: opacity 1s ease, filter 1s ease;
  }

  .row-track{
    position: relative;
    height: var(--row-h);
    overflow: hidden;
  }

  .row{
    position: absolute;
    top: 0; left: 0;
    display: flex;
    align-items: center;
    gap: var(--gap);
    height: 100%;
    width: max-content;
    will-change: transform;
    transition: animation-duration .8s linear, opacity .9s ease, filter .9s ease;
  }

  @keyframes moveRight{
    from{ transform: translate3d(-50%,0,0); }
    to{   transform: translate3d(0,0,0);  }
  }
  @keyframes moveLeft{
    from{ transform: translate3d(0,0,0);   }
    to{   transform: translate3d(-50%,0,0); }
  }

  .row-1{ animation: moveRight 24s linear infinite; }
  .row-2{ animation: moveLeft  20s linear infinite; }
  .row-3{ animation: moveRight 26s linear infinite; }
  .row-4{ animation: moveLeft  22s linear infinite; }

  .card{
    position: relative;
    height: calc(var(--row-h) - 20px);
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
    flex: 0 0 auto;
    border: 1px solid var(--gray-line);
    box-shadow: 0 6px 18px rgba(0,0,0,.5);
    contain: content;
    transform: translateZ(0);
  }

  /* Fondo de respaldo (se ve un instante mientras el .mp4 carga, o si falla la ruta) */
  .v1{ background: linear-gradient(150deg, var(--black-card), var(--purple-dark) 130%); }
  .v2{ background: linear-gradient(150deg, var(--black-card), var(--yellow-dark) 130%); }
  .v3{ background: linear-gradient(150deg, var(--purple-dim), var(--black-soft) 120%); }
  .v4{ background: linear-gradient(150deg, var(--yellow-dim), var(--black-soft) 120%); }
  .v5{ background: linear-gradient(150deg, var(--black-card), var(--black-soft)); }

  .thumb-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .thumb-video.is-ready{
    opacity: 1;
  }

  /* ===================== ACELERACIÓN Y SALIDA DE CARRUSELES ===================== */

  /* Oscurece el escenario a los 3.2s */
  body.phase-dim #carousel-stage{ filter: brightness(.5) saturate(.7); }

  /* Acelera y difumina las filas a los 5.9s */
  body.phase-exit .row-1{ animation-duration: 2.6s; }
  body.phase-exit .row-2{ animation-duration: 2.1s; }
  body.phase-exit .row-3{ animation-duration: 2.8s; }
  body.phase-exit .row-4{ animation-duration: 2.3s; }
  body.phase-exit .row{
    filter: brightness(.35) blur(2px);
    opacity: 0;
  }

  /* Oculta totalmente los carruseles a los 7.15s */
  body.phase-cover #carousel-stage {
    opacity: 0;
    pointer-events: none;
  }

  /* ===================== PORTADA ===================== */

  #cover{
    position: fixed; inset:0;
    background: var(--black);
    z-index: 10;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events:none;
  }
  body.phase-cover #cover{
    opacity: 1;
    pointer-events:auto;
  }

  /* ===================== ACCESIBILIDAD / MOTION ===================== */

  @media (prefers-reduced-motion: reduce){
    .row { animation: none !important; }
    #carousel-stage{ display:none; }
    #cover{ opacity:1 !important; pointer-events:auto; }
  }

  @media (max-width: 700px){
    :root{ --row-h: 16.5vh; --gap: 8px; }
  }
</style>
</head>
<body>

  <!-- ===================== 4 CARRUSELES "SERPIENTE" ===================== -->
  <div id="carousel-stage">
    <div class="row-track"><div class="row row-1" id="row1"></div></div>
    <div class="row-track"><div class="row row-2" id="row2"></div></div>
    <div class="row-track"><div class="row row-3" id="row3"></div></div>
    <div class="row-track"><div class="row row-4" id="row4"></div></div>
  </div>

  <!-- ===================== PORTADA (negra por ahora) ===================== -->
  <div id="cover"></div>

  <script>
    // ============================================================
    // ARRAY MODULAR DE VIDEOS
    // ============================================================
    const VIDEO_SOURCES = [
      './videos/prueba.webm',
      './videos/wallpaper1.webm',
      // Agrega más rutas de video aquí
    ];

    // ---------- Generación de las 40 tarjetas (10 por fila) ----------
    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const v = entry.target;
        // Solo reproduce si al menos el 15% del video está visible en pantalla
        if (entry.isIntersecting) {
          // Usamos un pequeño timeout para no saturar el arranque simultáneo
          requestAnimationFrame(() => {
            v.play().catch(() => {});
          });
        } else {
          v.pause();
        }
      });
    }, { 
      threshold: 0.15,
      rootMargin: "50px 0px" // Da un margen de carga antes de entrar
    });

    function buildRow(elId, start){
      const el = document.getElementById(elId);
      const fragment = document.createDocumentFragment();
      const cardsData = [];

      for(let i = 0; i < 10; i++){
        const n = start + i;
        cardsData.push({
          label: 'PROYECTO ' + String(n).padStart(2, '0'),
          variant: (n % 5) + 1,
          src: VIDEO_SOURCES[(n - 1) % VIDEO_SOURCES.length]
        });
      }

      // se duplica el set (x2) para lograr el loop infinito sin cortes
      const doubled = cardsData.concat(cardsData);

      doubled.forEach((data) => {
        const card = document.createElement('div');
        card.className = 'card v' + data.variant;

        const video = document.createElement('video');
        video.className = 'thumb-video';
        video.src = data.src;
        video.muted = true;
        video.loop = true;
        video.autoplay = true;
        video.playsInline = true;
        
        // --- NUEVOS AJUSTES DE RENDIMIENTO ---
        video.preload = 'metadata'; // No descarga el video entero de golpe, solo los datos básicos
        video.setAttribute('decoding', 'async'); // Saca la decodificación del hilo principal (evita los trompicones)
        // -------------------------------------
        
        video.addEventListener('loadeddata', () => video.classList.add('is-ready'), { once: true });

        card.appendChild(video);
        fragment.appendChild(card);

        // El observer que ya tienes hará que solo se reproduzcan los que están en pantalla
        videoObserver.observe(video);
      });

      el.appendChild(fragment);
    }

    buildRow('row1', 1);
    buildRow('row2', 11);
    buildRow('row3', 21);
    buildRow('row4', 31);

// ---------- Línea de tiempo de la intro ----------
    const body = document.body;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Función para liberar la memoria y destruir los videos
    function destroyCarousels() {
      const carouselStage = document.getElementById('carousel-stage');
      if (carouselStage) {
        videoObserver.disconnect(); // Apagamos el "vigilante" de los videos
        carouselStage.remove();     // Eliminamos todo el HTML de los carruseles
        console.log("Carruseles destruidos. Memoria liberada."); // (Opcional, para que lo compruebes en consola)
      }
    }

    if(!reduceMotion){
      setTimeout(() => body.classList.add('phase-dim'),   3200);
      setTimeout(() => body.classList.add('phase-exit'),  5900);
      
      setTimeout(() => {
        body.classList.add('phase-cover');
        
        // Destruimos los carruseles 1 segundo después de que aparezca la portada
        // para dar tiempo a que termine cualquier transición visual
        setTimeout(destroyCarousels, 1000); 
      }, 7150);
      
    } else {
      body.classList.add('phase-cover');
      destroyCarousels(); // Si tiene el movimiento reducido, los destruimos de inmediato
    }
  </script>
</body>
</html>
