<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camilo — Editor de Video</title>
    <style>
      @font-face {
        font-family: "Sequel Sans";
        src: url("./font/sequel-sans-display-bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      /* ============ TOKENS ============ */
      :root {
        --black: #0a0a0b;
        --black-soft: #151517;
        --black-card: #1b1b1d;
        --gray-line: #2a2a2c;
        --gray: #8c8c8f;
        --cream: #f3efe4;

        --yellow: #ffdf00;
        --yellow-pale: #fff6c2;
        --yellow-dim: #c9b000;

        --purple: #9729c4;
        --purple-light: #b657da;
        --purple-dim: #7a1f9e;
        --font: "Sequel Sans", "Arial Black", Arial, sans-serif;
        --grad: linear-gradient(to right, var(--purple-dim), var(--yellow) 85%);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--black);
        color: var(--cream);
        font-family: var(--font);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      body.lock-scroll {
        overflow: hidden;
        height: 100vh;
      }

      ::selection {
        background: var(--yellow-dim);
        color: var(--black);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        max-width: 100%;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* ============ INTRO LOADER ============ */
      #intro-loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: var(--black);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: opacity 0.7s ease;
      }

      #intro-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #dark-overlay {
        position: absolute;
        inset: 0;
        background: var(--black);
        opacity: 0;
        z-index: 5;
        transition: opacity 0.5s ease;
      }

      #dark-overlay.active {
        opacity: 0.86;
      }

      /* Cada fila ocupa un tercio exacto de la altura de la pantalla */
      .reel-track {
        flex: 1 1 0;
        min-height: 0;
        overflow: hidden;
        position: relative;
        border-bottom: 1px solid var(--black-soft);
        padding-top: 5px;
        padding-bottom: 5px;
        box-sizing: border-box;
      }

      .reel-track:last-child {
        border-bottom: none;
      }

      .reel-row {
        display: flex;
        height: 100%;
        width: max-content;
        gap: 6px;
        will-change: transform;
      }

      .reel-row.dir-left {
        animation: scroll-left 34s linear infinite;
      }
      .reel-row.dir-right {
        animation: scroll-right 40s linear infinite;
      }
      .reel-row.dir-slow {
        animation: scroll-left 52s linear infinite;
      }

      @keyframes scroll-left {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes scroll-right {
        from {
          transform: translateX(-50%);
        }
        to {
          transform: translateX(0);
        }
      }

      .thumb {
        position: relative;
        flex: 0 0 auto;
        height: 100%;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        background: var(--black-card);
        border: 3px solid var(--yellow);
        border-radius: 16px;
        box-sizing: border-box;
      }

      .thumb.alt {
        border-color: var(--purple);
      }

      .thumb-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ============ LOGO REVEAL ============ */
      #logo-reveal {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-130vh) rotate(-6deg);
      }

      #logo-reveal.drop {
        opacity: 1;
        animation: fall-in 0.75s cubic-bezier(0.34, 1.2, 0.5, 1) forwards;
      }

      #logo-reveal.zoom-out {
        animation: zoom-away 0.7s cubic-bezier(0.6, 0, 0.9, 0.3) forwards;
      }

      @keyframes fall-in {
        0% {
          transform: translateY(-130vh) rotate(-6deg);
        }
        58% {
          transform: translateY(18px) rotate(2deg);
        }
        75% {
          transform: translateY(-10px) rotate(-1deg);
        }
        100% {
          transform: translateY(0) rotate(0deg);
        }
      }

      @keyframes zoom-away {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(7);
          opacity: 0;
        }
      }

      .logo-container {
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        width: min(94vw, 1350px);
      }

      .logo-svg {
        display: block;
        width: 100%;
        font-family: var(--font);
        font-size: 180px;
        font-weight: 900;
        letter-spacing: 14px;
      }

      .text-base {
        fill: #ffffff;
      }

      .text-glow {
        fill: transparent;
        stroke: url(#light-beam);
        stroke-width: 4px;
        stroke-dasharray: 150 400;
        stroke-dashoffset: 400;
        animation: sweep 4s ease-in-out infinite alternate;
      }

      @keyframes sweep {
        0% {
          stroke-dashoffset: 400;
        }
        100% {
          stroke-dashoffset: -400;
        }
      }

      /* ============ MAIN PAGE ============ */
      #main-page {
        position: relative;
        z-index: 1;
        opacity: 0;
        transform: scale(1.06);
        transition:
          opacity 0.9s ease,
          transform 0.9s cubic-bezier(0.2, 0.7, 0.3, 1);
      }

      /* El header vive fuera de #main-page: así no hereda su animación de
     entrada y queda libre para desplazarse con el scroll de la página. */
      #header-float {
        position: relative;
        z-index: 51;
        opacity: 0;
        transition: opacity 0.6s ease 0.15s;
      }

      #header-float.visible {
        opacity: 1;
      }

      #main-page.visible {
        opacity: 1;
        transform: none;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 32px;
      }

      .section {
        height: calc(100vh - 90px);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ========================================================
     SEPARADOR ENTRE SECCIONES
     ======================================================== */
      .section-divider {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8vw;
      }

      .section-divider::before,
      .section-divider::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(
          to right,
          transparent,
          var(--purple-dim) 35%,
          var(--yellow) 85%,
          var(--yellow)
        );
      }

      .section-divider::after {
        background: linear-gradient(
          to left,
          transparent,
          var(--purple-dim) 35%,
          var(--yellow) 85%,
          var(--yellow)
        );
      }

      .section-divider .divider-spark {
        position: relative;
        width: 13px;
        height: 13px;
        margin: 0 1.4rem;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          var(--yellow-pale),
          var(--yellow) 45%,
          var(--purple) 100%
        );
        box-shadow:
          0 0 10px 2px rgba(255, 223, 0, 0.75),
          0 0 26px 8px rgba(151, 41, 196, 0.55);
        flex-shrink: 0;
      }

      .section-divider .divider-spark::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid rgba(255, 223, 0, 0.35);
      }

      @media (max-width: 600px) {
        .section-divider {
          padding: 0 6vw;
        }

        .section-divider .divider-spark {
          width: 11px;
          height: 11px;
          margin: 0 0.9rem;
        }
      }

      /* ============ HEADER (fijo) ============ */
      .site-header {
        position: fixed;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        width: min(92vw, 1100px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 28px;
        border-radius: 999px;
        border: 1.5px solid transparent;
        background:
          linear-gradient(var(--black), var(--black)) padding-box,
          var(--grad) border-box;
      }

      .header-mark {
        font-family: var(--font);
        font-size: 20px;
        letter-spacing: 0.05em;
        color: var(--cream);
      }

      .header-icons {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .header-icons a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        opacity: 0.92;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease,
          filter 0.2s ease;
      }

      .header-icons a svg {
        width: 100%;
        height: 100%;
      }

      /* Iconos alternando amarillo y morado */
      .header-icons a:nth-child(odd) {
        color: var(--yellow);
      }
      .header-icons a:nth-child(even) {
        color: var(--purple-light);
      }

      .header-icons a:hover {
        opacity: 1;
        filter: brightness(1.25);
        transform: translateY(-2px);
      }

      @media (max-width: 560px) {
        .site-header {
          padding: 12px 18px;
          top: 14px;
        }
        .header-icons {
          gap: 14px;
        }
        .header-icons a {
          width: 19px;
          height: 19px;
        }
      }

      /* ============ DESCRIPCIÓN: NOMBRE | FOTO | CANALES ============ */
      #descripcion .wrap {
        max-width: 1280px;
      }

      .descripcion-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        gap: 32px;
        align-items: center;
        width: 100%;
      }

      /* El texto queda por encima de la foto, que se solapa un poco con él */
      .descripcion-col {
        position: relative;
        z-index: 1;
      }

      .descripcion-kicker {
        display: block;
        font-size: 20px;
        letter-spacing: 0.04em;
        color: var(--purple-light);
        margin-bottom: 6px;
      }

      .descripcion-nombre {
        font-size: clamp(56px, 6.8vw, 104px);
        line-height: 0.95;
        text-transform: uppercase;
        color: var(--cream);
      }

      .descripcion-rol {
        margin: 14px 0 16px;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--yellow);
      }

      .descripcion-texto {
        color: var(--gray);
        font-size: 15px;
        line-height: 1.75;
        max-width: 340px;
      }

      /* Foto central con resplandor morado/amarillo y bordes difuminados */
      .descripcion-foto-wrap {
        position: relative;
        isolation: isolate;
        height: min(80vh, 660px);
        aspect-ratio: 4 / 5;
        margin: 0 -64px;
      }

      .descripcion-foto-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(ellipse 50% 40% at 22% 82%, rgba(151, 41, 196, 0.45), transparent),
          radial-gradient(ellipse 45% 35% at 80% 18%, rgba(255, 223, 0, 0.18), transparent);
      }

      /* Capa por encima de la foto: funde los cuatro bordes con el fondo negro */
      .descripcion-foto-wrap::after {
        content: "";
        position: absolute;
        inset: -1px;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(to bottom, var(--black) 0%, transparent 24%, transparent 50%, var(--black) 98%),
          linear-gradient(to right, var(--black) 0%, transparent 30%, transparent 70%, var(--black) 100%);
      }

      .descripcion-foto {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }

      .clientes-titulo {
        margin-bottom: 16px;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gray);
      }

      .clientes-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 320px;
      }

      /* Cada canal es un botón con borde amarillo/morado alterno */
      .cliente-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 20px 8px 8px;
        border-radius: 999px;
        border: 1.5px solid var(--yellow);
        background: var(--black-card);
        transition:
          transform 0.25s ease,
          background 0.25s ease;
      }

      .cliente-card.alt {
        border-color: var(--purple);
      }

      .cliente-card::after {
        content: "↗";
        margin-left: auto;
        color: var(--yellow);
      }

      .cliente-card.alt::after {
        color: var(--purple-light);
      }

      .cliente-card:hover {
        transform: translateX(-6px);
        background: var(--black-soft);
      }

      .cliente-img-wrap {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--black-soft);
        flex-shrink: 0;
      }

      .cliente-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cliente-nombre {
        font-size: 17px;
        color: var(--cream);
      }

      @media (max-width: 800px) {
        #descripcion {
          height: auto;
          min-height: calc(100vh - 90px);
          padding: 96px 0 40px;
        }
        .descripcion-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
          text-align: center;
        }
        .descripcion-texto {
          margin: 0 auto;
        }
        .descripcion-foto-wrap {
          height: min(54vh, 400px);
          margin: 0 auto;
        }
        .clientes-titulo {
          text-align: center;
        }

        /* Canales: 3 + 2 en dos filas, todos visibles */
        .clientes-grid {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
          max-width: 340px;
          margin: 0 auto;
        }
        .cliente-card {
          flex: 0 0 calc((100% - 20px) / 3);
          flex-direction: column;
          gap: 6px;
          padding: 12px 6px;
          border-radius: 18px;
        }
        .cliente-card::after {
          display: none;
        }
        .cliente-card:hover {
          transform: none;
        }
        .cliente-img-wrap {
          width: 48px;
          height: 48px;
        }
        .cliente-nombre {
          font-size: 13px;
        }
      }

      /* ============ VÍDEOS MÁS VISTOS ============ */
      #videos-mas-vistos {
        position: relative;
        display: block;
        height: 100vh;
        height: 100svh;
        min-height: 360px;
        overflow: hidden;
        background: #000;
      }

      .vmv-videos {
        position: absolute;
        inset: 0;
      }

      .vmv-videos video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .vmv-videos video.on {
        opacity: 1;
      }

      .vmv-sombra {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            to right,
            rgba(0, 0, 0, 0.7),
            rgba(0, 0, 0, 0.15) 55%,
            transparent
          ),
          linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent 30%);
      }

      .vmv-progreso {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 3;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
      }

      .vmv-progreso-fill {
        width: 0;
        height: 100%;
        background: var(--yellow);
      }

      .vmv-punto {
        position: absolute;
        top: 50%;
        left: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--yellow);
        transform: translate(-50%, -50%);
      }

      .vmv-lista {
        --h: 52px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(520px, 80vw);
        z-index: 2;
        overflow: hidden;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-x;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent,
          #000 22%,
          #000 88%,
          transparent
        );
        mask-image: linear-gradient(
          to bottom,
          transparent,
          #000 22%,
          #000 88%,
          transparent
        );
      }

      .vmv-lista.drag {
        cursor: grabbing;
      }

      .vmv-items {
        position: absolute;
        left: 32px;
        right: 0;
        top: 0;
        transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.3, 1);
      }

      .vmv-item {
        display: flex;
        align-items: center;
        width: 100%;
        height: var(--h);
        padding: 0;
        border: 0;
        border-top: 1px solid transparent;
        border-bottom: 1px solid transparent;
        background: none;
        cursor: pointer;
        text-align: left;
        -webkit-tap-highlight-color: transparent;
        font-family: var(--font);
        font-size: 12px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--cream);
        opacity: max(0.15, calc(1 - var(--d, 0) * 0.22));
        transition:
          opacity 0.4s,
          font-size 0.4s,
          color 0.4s;
      }

      .vmv-item:hover {
        opacity: 1;
      }

      .vmv-item.on {
        border-top-color: rgba(255, 255, 255, 0.25);
        border-bottom-color: rgba(255, 255, 255, 0.25);
        color: var(--yellow);
        font-size: 15px;
        opacity: 1;
      }

      .vmv-watch {
        position: absolute;
        right: 24px;
        bottom: 24px;
        z-index: 3;
        padding: 14px 26px;
        border: 1.5px solid transparent;
        border-radius: 999px;
        font-family: var(--font);
        font-size: 14px;
        letter-spacing: 0.08em;
        color: var(--cream);
        cursor: pointer;
        background:
          linear-gradient(var(--black), var(--black)) padding-box,
          var(--grad) border-box;
        transition: color 0.2s;
      }

      .vmv-watch:hover {
        color: var(--yellow);
      }

      body.vmv-modal-open {
        overflow: hidden;
      }

      .vmv-modal {
        position: fixed;
        width: min(1000px, 92vw);
        max-height: 92vh;
        margin: auto;
        padding: 0;
        overflow: hidden;
        color: var(--cream);
        border: 1.5px solid transparent;
        border-radius: 16px;
        background:
          linear-gradient(#000, #000) padding-box,
          var(--grad) border-box;
      }

      .vmv-modal::backdrop {
        background: rgba(0, 0, 0, 0.88);
      }

      .vmv-modal video {
        display: block;
        width: 100%;
        max-height: 80vh;
        background: #000;
      }

      .vmv-modal-titulo {
        padding: 14px 20px;
        font-family: var(--font);
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .vmv-modal-cerrar {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.65);
        color: var(--cream);
        font-size: 16px;
        cursor: pointer;
        transition: color 0.2s;
      }

      .vmv-modal-cerrar:hover {
        color: var(--yellow);
      }

      @media (max-height: 500px) {
        .vmv-lista {
          --h: 38px;
        }

        .vmv-items {
          left: 20px;
        }

        .vmv-item {
          font-size: 11px;
        }

        .vmv-item.on {
          font-size: 13px;
        }

        .vmv-watch {
          right: 16px;
          bottom: 16px;
          padding: 10px 20px;
        }
      }

      @media (max-width: 800px) and (min-height: 501px), (max-aspect-ratio: 1/1) {
        #videos-mas-vistos {
          display: flex;
          flex-direction: column;
          justify-content: center;
          height: auto;
          min-height: 100svh;
          padding: 96px 0 40px;
        }

        .vmv-videos {
          position: relative;
          inset: auto;
          order: 1;
          width: 100%;
          aspect-ratio: 16 / 9;
        }

        .vmv-videos video {
          object-fit: contain;
        }

        .vmv-sombra {
          display: none;
        }

        .vmv-progreso {
          position: relative;
          inset: auto;
          order: 2;
        }

        .vmv-lista {
          --h: 56px;
          position: relative;
          inset: auto;
          order: 3;
          width: 100%;
          height: var(--h);
          margin-top: 18px;
          touch-action: pan-y;
          -webkit-mask-image: linear-gradient(
            to right,
            transparent,
            #000 18%,
            #000 82%,
            transparent
          );
          mask-image: linear-gradient(
            to right,
            transparent,
            #000 18%,
            #000 82%,
            transparent
          );
        }

        .vmv-items {
          left: 0;
          right: auto;
          display: flex;
          width: max-content;
          height: 100%;
        }

        .vmv-item {
          flex: none;
          width: auto;
          max-width: calc(100vw - 40px);
          padding: 0 20px;
          border-top: 0;
          border-bottom: 2px solid transparent;
          overflow: hidden;
          text-overflow: ellipsis;

          {
            src: "./videos/CLIPS/CRVSH/CLASIFICANDO MUJERES POR SU ATRACTIVO  5 CHICAS VS 5 CHICOS.mp4",
            titulo: "Clasificando mujeres por su atractivo - 5 chicas VS 5 chicos",
          },
        ]);

        const vmvVideos = document.getElementById("vmv-videos");
        const vmvItems = document.getElementById("vmv-items");
        const vmvLista = document.getElementById("vmv-lista");
        const vmvFill = document.getElementById("vmv-fill");
        const vmvPunto = document.getElementById("vmv-punto");
        const vmvWatch = document.getElementById("vmv-watch");
        const vmvN = videosMasVistos.length;
        const VMV_MQ =
          "(max-width: 800px) and (min-height: 501px), (max-aspect-ratio: 1/1)";
        const vmvHoriz = () => window.matchMedia(VMV_MQ).matches;
        let vmvActual = 0;
        let vmvArrastrando = false;
        let vmvPausado = false;
        let vmvIniciado = false;

        const vmvVideoEls = videosMasVistos.map((data, index) => {
          const video = document.createElement("video");
          video.muted = true;
          video.playsInline = true;
          video.preload = index === 0 ? "auto" : "none";
          video.src = encodeURI(data.src);
          video.addEventListener("ended", () => {
            if (vmvIniciado && !vmvArrastrando && index === vmvActual) {
              vmvActivar((index + 1) % vmvN);
            }
          });
          video.addEventListener("error", () => {
            if (vmvIniciado && index === vmvActual) {
              window.setTimeout(() => {
                if (vmvIniciado && !vmvPausado && index === vmvActual) {
                  vmvActivar((index + 1) % vmvN);
                }
              }, 1500);
            }
          });
          vmvVideos.appendChild(video);
          return video;
        });

        const vmvItemEls = videosMasVistos.map((data, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "vmv-item";
          button.textContent = data.titulo;
          button.title = data.titulo;
          button.addEventListener("click", () => vmvActivar(index));
          vmvItems.appendChild(button);
          return button;
        });

        function vmvResaltar(index) {
          vmvItemEls.forEach((item, itemIndex) => {
            const distance = Math.abs(itemIndex - index);
            item.style.setProperty("--d", distance);
            item.classList.toggle("on", itemIndex === index);
          });
        }

        function vmvCentrar(index, delta = 0, animate = true) {
          const item = vmvItemEls[index];
          vmvItems.style.transition = animate ? "" : "none";
          if (vmvHoriz()) {
            const center = item.offsetLeft + item.offsetWidth / 2;
            vmvItems.style.transform = `translate(${vmvLista.clientWidth / 2 - center + delta}px, 0)`;
          } else {
            const center = item.offsetTop + item.offsetHeight / 2;
            vmvItems.style.transform = `translate(0, ${vmvLista.clientHeight * 0.55 - center + delta}px)`;
          }
        }

        function vmvMarcar(index, animate = true) {
          vmvResaltar(index);
          vmvCentrar(index, 0, animate);
          vmvFill.style.width = "0%";
          vmvPunto.style.left = "0%";
        }

        function vmvActivar(index) {
          vmvActual = index;
          vmvMarcar(index);
          vmvVideoEls.forEach((video, videoIndex) => {
            video.classList.toggle("on", videoIndex === index);
            if (videoIndex !== index) video.pause();
          });

          const video = vmvVideoEls[index];
          video.currentTime = 0;
          video.play().catch((error) => {
            console.warn("No se pudo reproducir el vídeo seleccionado:", error);
          });
          vmvVideoEls[(index + 1) % vmvN].preload = "auto";
        }

        let vmvRaf = 0;
        let vmvVisible = true;
        function vmvArrancar() {
          if (!vmvRaf) vmvRaf = requestAnimationFrame(vmvTick);
        }

        function vmvTick() {
          vmvRaf = 0;
          if (vmvPausado || !vmvVisible) return;
          const video = vmvVideoEls[vmvActual];
          if (video.duration && Number.isFinite(video.duration)) {
            const limit = Math.min(TIEMPO_MAX, video.duration);
            const progress = Math.min(video.currentTime / limit, 1);
            vmvFill.style.width = `${progress * 100}%`;
            vmvPunto.style.left = `${progress * 100}%`;
            if (progress >= 1 && !vmvArrastrando && !video.ended) {
              vmvActivar((vmvActual + 1) % vmvN);
            }
          }
          vmvArrancar();
        }

        function iniciarVmv() {
          if (vmvIniciado) return;
          vmvIniciado = true;
          vmvActivar(0);
          vmvArrancar();
        }

        vmvVideoEls[0].classList.add("on");
        vmvMarcar(0);

        /* ---------- Arrastrar la lista (ratón y táctil) ---------- */
        let vmvMovido = false;
        let vmvInicio = 0;
        let vmvDest = 0;

        const vmvCentroItem = (index) => {
          const item = vmvItemEls[index];
          return vmvHoriz()
            ? item.offsetLeft + item.offsetWidth / 2
            : item.offsetTop + item.offsetHeight / 2;
        };

        vmvLista.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          vmvArrastrando = true;
          vmvMovido = false;
          vmvDest = vmvActual;
          vmvInicio = vmvHoriz() ? event.clientX : event.clientY;
        });

        window.addEventListener("pointermove", (event) => {
          if (!vmvArrastrando) return;
          const delta =
            (vmvHoriz() ? event.clientX : event.clientY) - vmvInicio;
          if (!vmvMovido && Math.abs(delta) < 6) return;
          if (!vmvMovido) {
            vmvMovido = true;
            vmvLista.classList.add("drag");
          }
          vmvCentrar(vmvActual, delta, false);

          const reference = vmvCentroItem(vmvActual) - delta;
          let closest = 0;
          let closestDistance = Infinity;
          for (let index = 0; index < vmvN; index++) {
            const distance = Math.abs(vmvCentroItem(index) - reference);
            if (distance < closestDistance) {
              closestDistance = distance;
              closest = index;
            }
          }
          if (closest !== vmvDest) {
            vmvDest = closest;
            vmvResaltar(closest);
          }
        });

        function vmvSoltar() {
          if (!vmvArrastrando) return;
          vmvArrastrando = false;
          vmvLista.classList.remove("drag");
          if (!vmvMovido) {
            if (vmvVideoEls[vmvActual].ended) {
              vmvActivar((vmvActual + 1) % vmvN);
            }
            return;
          }
          if (vmvDest !== vmvActual) vmvActivar(vmvDest);
          else if (vmvVideoEls[vmvActual].ended) {
            vmvActivar((vmvActual + 1) % vmvN);
          } else {
            vmvMarcar(vmvActual);
          }
        }

        window.addEventListener("pointerup", vmvSoltar);
        window.addEventListener("pointercancel", vmvSoltar);

        vmvLista.addEventListener(
          "click",
          (event) => {
            if (vmvMovido && event.detail !== 0) {
              event.stopPropagation();
              event.preventDefault();
              vmvMovido = false;
            }
          },
          true,
        );

        window.addEventListener("resize", () => vmvMarcar(vmvActual, false));
        if (document.fonts) {
          document.fonts.ready.then(() => vmvMarcar(vmvActual, false));
        }

        new IntersectionObserver(
          ([entry]) => {
            vmvVisible = entry.isIntersecting;
            if (!vmvIniciado || vmvPausado) return;
            const video = vmvVideoEls[vmvActual];
            if (vmvVisible) {
              vmvArrancar();
              video.play().catch((error) => {
                console.warn("No se pudo reanudar el vídeo:", error);
              });
            } else {
              video.pause();
            }
          },
          { threshold: 0.2 },
        ).observe(document.getElementById("videos-mas-vistos"));

        /* ---------- Popup de vídeo ---------- */
        const vmvModal = document.getElementById("vmv-modal");
        const vmvModalVideo = document.getElementById("vmv-modal-video");
        const vmvModalTitulo = document.getElementById("vmv-modal-titulo");

        vmvWatch.addEventListener("click", () => {
          const data = videosMasVistos[vmvActual];
          vmvPausado = true;
          vmvVideoEls[vmvActual].pause();
          document.body.classList.add("vmv-modal-open");
          vmvModalTitulo.textContent = data.titulo;
          vmvModalVideo.src = encodeURI(data.src);
          vmvModal.showModal();
          vmvModalVideo.play().catch((error) => {
            console.warn("No se pudo reproducir el vídeo del popup:", error);
          });
        });

        vmvModal.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && vmvModal.open) {
            event.preventDefault();
            vmvModal.close();
          }
        });

        vmvModal.addEventListener("close", () => {
          vmvModalVideo.pause();
          vmvModalVideo.removeAttribute("src");
          vmvModalVideo.load();
          document.body.classList.remove("vmv-modal-open");
          vmvPausado = false;
          vmvVideoEls[vmvActual].play().catch((error) => {
            console.warn("No se pudo reanudar el vídeo de fondo:", error);
          });
          vmvArrancar();
        });

        document
          .getElementById("vmv-modal-cerrar")
          .addEventListener("click", () => vmvModal.close());
        vmvModal.addEventListener("click", (event) => {
          if (event.target === vmvModal) vmvModal.close();
        });

        /* ---------- Orquestación de la secuencia de intro ---------- */
        const loader = document.getElementById("intro-loader");
        const overlay = document.getElementById("dark-overlay");
        const logoWrap = document.getElementById("logo-reveal");
        const mainPage = document.getElementById("main-page");
        const headerFloat = document.getElementById("header-float");
        const body = document.body;

        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        function mostrarPaginaPrincipal() {
          loader.remove();
          logoWrap.remove();
          body.classList.remove("lock-scroll");
          mainPage.classList.add("visible");
          headerFloat.classList.add("visible");
          iniciarVmv();
        }

        if (reduceMotion) {
          mostrarPaginaPrincipal();
        } else {
          const T_CARRUSEL = 1000; // 1s de carrusel antes del logo
          const T_CAIDA = 750; // duración de la caída del logo
          const T_ESPERA = 1000; // 1s el logo se queda mostrando el barrido
          const T_ZOOM = 700; // duración del zoom de transición

          // 1) A los 2s: oscurece el fondo y deja caer el logo
          setTimeout(() => {
            overlay.classList.add("active");
            logoWrap.classList.add("drop");
          }, T_CARRUSEL);

          // 2) Tras la caída + 1s mostrando el logo: zoom de transición
          setTimeout(
            () => {
              logoWrap.classList.add("zoom-out");
              loader.classList.add("fade-out");
            },
            T_CARRUSEL + T_CAIDA + T_ESPERA,
          );

          // 3) Al terminar el zoom: revelar la página principal
          setTimeout(
            () => {
              mostrarPaginaPrincipal();
            },
            T_CARRUSEL + T_CAIDA + T_ESPERA + T_ZOOM,
          );
        }
        /* ---------- Formulario de contacto (envío por FormSubmit) ---------- */
        const EMAIL_CONTACTO = "info.camilobotero@gmail.com";
        const form = document.getElementById("contact-form");
        const estado = document.getElementById("contact-status");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const boton = form.querySelector("button[type=submit]");
          const datos = Object.fromEntries(new FormData(form));
          if (datos._honey) return; // anti-spam: lo rellenan solo los bots
          delete datos._honey;

          boton.disabled = true;
          estado.className = "contact-status";
          estado.textContent = "Enviando…";
          try {
            const r = await fetch(`https://formsubmit.co/ajax/${EMAIL_CONTACTO}`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({
                ...datos,
                _subject: `Nuevo mensaje de ${datos.nombre} desde la web`,
                _template: "table",
                _replyto: datos.correo,
              }),
            });
            const res = await r.json();
            if (!r.ok || String(res.success) === "false") throw new Error(res.message);
            form.reset();
            estado.textContent = "¡Mensaje enviado! Te responderé lo antes posible.";
            estado.classList.add("ok");
          } catch {
            estado.textContent = `No se pudo enviar. Escríbeme directamente a ${EMAIL_CONTACTO}`;
            estado.classList.add("error");
          } finally {
            boton.disabled = false;
          }
        });

        /* ---------- Scroll suave (rueda y teclado; en táctil se usa el nativo) ---------- */
        if (!reduceMotion && !matchMedia("(pointer: coarse)").matches) {
          const root = document.documentElement;
          const TAU = 110; // ms: más bajo = más ágil, más alto = más "flotante"
          let objetivo = 0;
          let actual = 0;
          let raf = 0;
          let t0 = 0;
          const base = () => (raf ? objetivo : scrollY);
          const bloqueado = () => body.classList.contains("lock-scroll") || vmvModal.open;

          function paso(t) {
            actual += (objetivo - actual) * (1 - Math.exp(-Math.max(0, t - t0) / TAU));
            t0 = t;
            if (Math.abs(objetivo - actual) < 0.5) actual = objetivo;
            scrollTo(0, actual);
            raf = actual === objetivo ? 0 : requestAnimationFrame(paso);
          }

          function ir(valor) {
            if (!raf) {
              actual = scrollY;
              t0 = performance.now();
              raf = requestAnimationFrame(paso);
            }
            objetivo = Math.max(0, Math.min(valor, root.scrollHeight - innerHeight));
          }

          addEventListener(
            "wheel",
            (e) => {
              if (e.ctrlKey || bloqueado() || e.target.closest("textarea")) return;
              e.preventDefault();
              const f = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? innerHeight : 1;
              ir(base() + e.deltaY * f);
            },
            { passive: false },
          );

          const TECLAS = { ArrowDown: 80, ArrowUp: -80, PageDown: 0.9, PageUp: -0.9, " ": 0.9 };
          addEventListener("keydown", (e) => {
            if (e.altKey || e.ctrlKey || e.metaKey || bloqueado()) return;
            if (e.target.closest("input, textarea, select, button, video, [contenteditable]")) return;
            const v = TECLAS[e.key];
            if (e.key === "Home" || e.key === "End") ir(e.key === "Home" ? 0 : root.scrollHeight);
            else if (v !== undefined) {
              const signo = e.shiftKey && e.key === " " ? -1 : 1;
              ir(base() + (Math.abs(v) < 1 ? v * innerHeight : v) * signo);
            } else return;
            e.preventDefault();
          });

          // Si algo externo mueve el scroll (barra, anclas), se cancela la animación
          addEventListener("scroll", () => {
            if (raf && Math.abs(scrollY - actual) > 3) {
              cancelAnimationFrame(raf);
              raf = 0;
            }
          }, { passive: true });
        }
      })();
    </script>
  </body>
</html>
